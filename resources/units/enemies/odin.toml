# Один: ударный титан Legion. Быстрее прочих титанов и бьёт тяжелее всех за выстрел.
#
# Роль — прорыв. Скорость 1.8 против 1.3 у Тора означает, что Один доходит до базы
# раньше, чем игрок успевает собрать против него отряд, а урон 110 за выстрел снимает
# лёгкого юнита разом. Противовес один: пауза 0.9 секунды между выстрелами, за которую
# группа успевает отойти или ударить в ответ.
#
# Силуэт — стрела с отнесёнными назад крыльями: самый широкий корпус в наборе.

