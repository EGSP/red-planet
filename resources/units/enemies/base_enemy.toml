# Общий предок видов противника. Наследует base_unit; сам в каталог не попадает.

id       = "base_enemy"
base     = "/units/base_unit.toml"
abstract = true
name     = "Противник"
class    = "enemy"
color    = [0.9, 0.35, 0.3]
tags     = ["mobile", "enemy"]

[body]
radius = 0.4

[movement]
speed      = 2.0
turn_speed = 120.0

# Боевая мощь: одна шкала на обе стороны. У игрока из неё складывается слагаемое «армия»
# показателя террора, у противника той же величиной меряется занятое место в бюджете
# постоянного давления.
[terror]
army_power = 1.0
