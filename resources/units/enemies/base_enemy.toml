# Общий предок видов противника. Сам в игру не попадает: abstract означает, что
# определение существует только как основа для наследников.
#
# Здесь лежит всё, что у видов одинаково, — сторона, теги, умолчания по телу и ходу.
# Наследник переопределяет только то, чем отличается, и его файл читается как перечень
# отличий, а не как повтор двадцати строк. Приём взят из PA, где это base_spec.

id       = "base_enemy"
abstract = true
name     = "Противник"
class    = "enemy"
color    = [0.9, 0.35, 0.3]
tags     = ["mobile", "enemy"]

[body]
max_health   = 100.0
radius       = 0.4
vision_range = 9.0

[movement]
speed      = 2.0
turn_speed = 120.0

# Поведение в схватке. Доля дальности, на которой юнит прекращает сближение
[battle]
standoff = 0.75

# Боевая мощь: одна шкала на обе стороны. У игрока из неё складывается слагаемое «армия»
# показателя террора, у противника той же величиной меряется занятое место в бюджете
# постоянного давления. Вес появления отсюда убран: как часто вид выставляют, определению
# юнита знать незачем — это решение той стороны, которая его выставляет
[terror]
army_power = 1.0
