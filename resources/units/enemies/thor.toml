# Тор: осадный титан Legion. Наибольшая дальность в игре — десять клеток.
#
# Смысл вида в том, что турель его не достаёт. Тор встаёт вне зоны обороны и разбирает
# её постройку за постройкой, поэтому единственный ответ — выйти к нему армией.
# Ровно это и требуется от пункта «турель или армия»: появление Тора делает выбор
# в пользу одних турелей проигрышным, не запрещая его напрямую.
#
# Силуэт — подкова, разомкнутая вперёд: тяжёлая шагающая машина Legion.

id    = "thor"
base  = "/units/enemies/base_enemy.toml"
name  = "Тор"
color = [0.9, 0.35, 0.45]
tags  = ["mobile", "enemy", "titan"]
tools = ["thor_siege"]

[body]
max_health   = 2800.0
radius       = 0.95
vision_range = 13.0
hull         = "crescent"
armor_rings  = 2

[movement]
speed      = 1.3
turn_speed = 35.0
brake      = 3.0

# Останавливается заметно раньше предела дальности: осадной машине незачем подходить,
# и запас в отступе оставляет ей место для отхода
[battle]
approach_hold = 0.8

[terror]
army_power = 20.0
