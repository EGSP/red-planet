# Атлас: сейсмический титан MLA. Шагающая машина, которая ломает застройку в упор.
#
# Роль — таран. Дальность 2.2 при прочности 2600 означает, что до цели он обязан дойти,
# и весь расчёт против него строится на том, чтобы этого не позволить. Обратное верно
# для игрока: Атлас имеет смысл там, где нужно снести укреплённую точку, а не там,
# где надо держать рубеж.
#
# Силуэт — звезда: шесть лучей попеременной длины вокруг ядра. Форма выбрана затем,
# чтобы шагающая машина отличалась от катящейся не подписью, а очертанием.

id       = "atlas"
base     = "/units/base_unit.toml"
name     = "Атлас"
color    = [0.55, 0.85, 0.75]
tags     = ["mobile", "titan", "important"]
tools    = ["atlas_hammer"]

# Каркас титана занимает четыре клетки: место под него приходится расчищать,
# и это часть цены — застроенная вплотную база собственный титан построить не даст
[footprint]
rows = ["##", "##"]

[body]
max_health   = 2600.0
radius       = 0.95
vision_range = 12.0
hull         = "star"
armor_rings  = 2
front_plate  = true

[movement]
speed      = 1.4
turn_speed = 40.0
brake      = 4.0

[battle]
approach_hold = 0.5

[assembly]
cost_metal   = 4200.0
frame_health = 3000.0

# Мощь армии: восемнадцать. Ориентир — Каратель с тройкой, то есть один титан весит
# как шесть его. Это осознанно ниже честного соотношения прочностей: мощь меряет место
# в бюджете давления, а не боевую ценность, и приравнивать их значило бы вытеснить
# титаном весь остальной противник с карты
[terror]
army_power = 18.0
