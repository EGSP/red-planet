# Арес: титан-крепость MLA. Медленный, дальнобойный, держит пространство перед собой.
#
# Роль обратна Атласу. Дальность 9.5 превышает турельные 7, поэтому Арес разбирает
# оборону, не входя в неё, но вблизи почти беспомощен: темп стрельбы низкий, разворот
# медленный, и подошедший вплотную отряд он не успевает переводить в прицел.
#
# Силуэт — блочная крепость: единственный корпус, у которого длина заметно больше ширины.

id    = "ares"
