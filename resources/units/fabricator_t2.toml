# Продвинутый фабрикатор: единственный, кто ставит каркасы титанов.
#
# ПОЧЕМУ ТИТАН СТРОИТСЯ КАРКАСОМ, А НЕ ОЧЕРЕДЬЮ ЗАВОДА. Каркас уже несёт всё, что титану
# нужно: пониженную прочность на время сборки, место на карте, которое приходится
# расчищать, и возможность перехватить постройку до её завершения. Очередь завода не даёт
# ничего из этого — там титан был бы обычным юнитом с большим ценником.
#
# Строит только титанов. Обычную застройку ведут коммандер и фабрикатор: если бы
# продвинутый умел и то и другое, он вытеснил бы обычного целиком.

id       = "fabricator_t2"
base     = "/units/base_unit.toml"
name     = "Тяжёлый фабрикатор"
color    = [0.35, 0.8, 0.7]
buildbar = "fabricator_t2_buildbar"
tags     = ["mobile", "builder"]
tools    = ["fabricator_t2_arm"]

[footprint]
rows = ["#"]

[body]
max_health   = 220.0
radius       = 0.42
vision_range = 10.0
hull         = "hex"

[movement]
speed      = 3.0
turn_speed = 180.0

[assembly]
cost_metal   = 900.0
frame_health = 260.0

[terror]
army_power = 0.0
