# Фабрикатор: строит и чинит, копать не умеет.

id       = "fabricator"
base     = "/units/base_unit.toml"
name     = "Фабрикатор"
color    = [0.4, 0.9, 0.5]
buildbar = "fabricator_buildbar"
tags     = ["mobile", "builder"]
tools    = ["fabricator_arm"]

# Клетка, которую занимает КАРКАС на время сборки. Собранный фабрикатор с неё уходит:
# что получится из каркаса — постройка или юнит — решает class, а не форма
[footprint]
rows = ["#"]

[body]
max_health = 90.0
radius     = 0.32

[movement]
speed      = 4.0
turn_speed = 240.0

[assembly]
cost_metal = 150.0

# Каркас крепче собранного фабрикатора: недостроенный корпус ещё не несёт начинки.
# Раньше эти два числа лежали в разных файлах под одним именем max_health
frame_health = 120.0
