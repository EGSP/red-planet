# Inferno: тяжёлый ближний танк MLA. Выпускается заводом машин.

id    = "inferno"
base  = "/units/base_unit.toml"
name  = "Инферно"
class = "vehicle"
color = [0.41, 0.6, 0.82]
tools = ["inferno_flamer"]

[footprint]
rows = ["#"]

[body]
max_health   = 1000.0
radius       = 0.48
vision_range = 8.0
model = "res://resources/units/player/inferno/inferno.tscn"

[battle]
# Огнемёт достаёт на 1,3 клетки, поэтому удержание места означало бы для Инферно отказ
# от боя почти со всеми: цели, до которой он дотянется, не покидая поля внимания, обычно
# не находится. Он идёт за противником сам и возвращается на место, когда драться не с кем
engagement = "pursue"

[movement]
speed      = 2.0
turn_speed = 90.0
brake      = 6.0

[assembly]
cost_metal   = 225.0
frame_health = 1100.0

[terror]
army_power = 2.5
