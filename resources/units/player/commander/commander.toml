# Коммандер: единственный, кто слушает приказы. Гибель коммандера — поражение.
#
# Секция [assembly] есть не для постройки — коммандера не строит никто и ни в одной панели
# он не значится, — а ради курса ремонта: курс выводится из цены (UnitDefinition.HealthPerMetal),
# и без цены починить коммандера было нечем ни башне-сборщику, ни ремонтнику.
#
# Экономика как в celestial / PA Titans: production energy 2000, metal 20; HP 12500.

id       = "commander"
base     = "/units/base_unit.toml"
name     = "Коммандер"
class    = "commander"
color    = [0.52, 0.75, 0.9]
buildbar = "commander_buildbar"
tags     = ["mobile", "commander", "builder", "important"]

tools = ["commander_gun", "commander_arm"]

[body]
max_health   = 12500.0
radius       = 0.38
hull         = "crown"
vision_range = 11.0

[movement]
speed      = 3.0
turn_speed = 200.0

[production]
energy = 2000.0
metal  = 20.0

# Цена подобрана по отношению прочности к цене у Ant и Ares — 1,67 прочности за метал:
# починка коммандера обходится за единицу прочности столько же, сколько починка всего
# остального. Полное восстановление 12500 прочности стоит 7500 метала
[assembly]
cost_metal = 7500.0

[terror]
army_power = 0.0

[orders]
deny = ["delete"]
