# Коммандер: единственный, кто слушает приказы, и единственный, кого нельзя потерять.
# Секции [assembly] у него нет намеренно — его никто не строил, а значит и чинить нечем:
# курс ремонта выводится из цены, которой не существует.
#
# Экономика как в celestial / PA Titans, энергия сжата в 100 раз (2000 → 20):
# тело даёт 20 энергии, рука жжёт 30 — на 50% больше собственной генерации,
# чтобы без первой электростанции стройка уже подрезала запас.

id       = "commander"
base     = "/units/base_unit.toml"
name     = "Коммандер"
class    = "commander"
color    = [0.35, 0.75, 1.0]
buildbar = "commander_buildbar"
tags     = ["mobile", "commander", "builder", "important"]

# Два инструмента: пушка и строительная рука. У каждого своя дальность и своя прожорливость —
# раньше дальность была одна на все занятия, потому что лежала прямо в определении юнита.
tools = ["commander_gun", "commander_arm"]

[body]
max_health   = 300.0
radius       = 0.38
vision_range = 11.0

[movement]
speed      = 3.0
turn_speed = 200.0

# Собственный доход с самого начала: без него ни первого генератора, ни первого экстрактора
# было бы не на что строить. Метал — как у PA (20), энергия — сжатая шкала (20).
[production]
energy = 40.0
metal  = 40.0

# В мощь армии не входит, хотя подвижен и вооружён. Причина та же, что у крепости: коммандер
# выдан, а не построен, и потерять его нельзя — считать его армией значило бы приписать
# игроку силу, которой он не распоряжается. Его собственная выработка в террор при этом
# входит: производство меряется потоком, а не составом, и отдельного знаменателя у него нет
[terror]
army_power = 0.0

# Снос снят с унаследованного allow: коммандера нельзя потерять по Del.
[orders]
deny = ["delete"]
