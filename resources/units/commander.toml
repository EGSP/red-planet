# Коммандер: единственный, кто слушает приказы, и единственный, кого нельзя потерять.
# Секции [assembly] у него нет намеренно — его никто не строил, а значит и чинить нечем:
# курс ремонта выводится из цены, которой не существует.

id       = "commander"
name     = "Коммандер"
class    = "commander"
color    = [0.35, 0.75, 1.0]
buildbar = "commander"
tags     = ["mobile", "commander", "builder", "miner", "important"]

# Три инструмента: пушка, рука и бур. У руки и бура своя дальность и своя прожорливость —
# раньше дальность была одна на оба занятия, потому что лежала прямо в определении юнита.
tools = ["commander_gun", "commander_arm", "commander_drill"]

[body]
max_health   = 300.0
radius       = 0.38
vision_range = 11.0

[movement]
speed      = 3.0
turn_speed = 200.0

# Собственный доход с самого начала: без него первую электростанцию было бы не на что строить
[production]
energy = 30.0
metal  = 2.0
