# Тестовая копия завода ботов: габарит 4x4, спрайт вписан в габарит без выступа.
#
# ЗАЧЕМ. Увидеть, как крупная постройка читается на карте и уживается с плотной застройкой.
# Числа боя и стройки взяты у подлинника намеренно: исследуется размер, и вторая изменённая
# величина смешала бы следствия размера со следствиями цены.
#
# ПОЧЕМУ sprite_scale = 1.0, А НЕ 1.2, КАК У ПОДЛИННИКА. Множитель у подлинника означает,
# что корпус выступает за занятое место на пятую часть. При размере 2x2 выступ невелик,
# а на крупной постройке он превращается в заметное расхождение видимого корпуса с тем,
# что на самом деле занято и застроено. У копий видимый корпус и занятое место совпадают.
#
# ПОЧЕМУ 4x4, А НЕ 3x3. Видимый корпус подлинника — 2.4 клетки (1.2 от габарита 2x2).
# Полтора раза от него дают 3.6 клетки, а габарит задаётся целым числом клеток; 4x4 —
# ближайшее целое, то есть примерно в 1.7 раза крупнее подлинника по видимому корпусу.

id   = "bot_factory_4x4"
base = "/buildings/bot_factory/bot_factory.toml"
name = "Завод ботов 4×4"

[footprint]
rows = ["####", "####", "####", "####"]

[body]
sprite_scale = 1.0

[terror]
expansion_power = 8.0
