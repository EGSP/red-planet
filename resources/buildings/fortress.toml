# Крепость: стоит с первой секунды, но цена у неё есть — из цены выводится курс ремонта.
# Хранилище стартовое несёт Const (как врождённый запас коммандера в PA); крепость сама
# потолок не поднимает — иначе старт удваивал бы то, что уже заложено в Const.
#
# Id — fortress, не base: слово base занято ключом наследования TOML.

id    = "fortress"
base  = "/buildings/base_building.toml"
name  = "Крепость"
color = [0.35, 0.4, 0.55]
tags  = ["structure", "economy", "important"]

[footprint]
rows           = ["###", "###", "###"]
facing_degrees = -90.0

[body]
max_health = 4000.0

# Крепость в экспансию не входит, хотя постройкой является и умолчание дало бы ей единицу.
# Показатель меряет то, что игрок нарастил, а крепость стоит с первой секунды и решением
# не является: считать её значило бы стартовать с ненулевого террора, который ничем
# не заработан. Ноль здесь — это «не в счёт», а не «забыли заполнить»
[terror]
expansion = 0.0

[assembly]
cost_metal = 800.0

# Явный запрет сноса: не принят и в панели не показывается (в отличие от пустого allow).
[orders]
deny = ["delete"]
