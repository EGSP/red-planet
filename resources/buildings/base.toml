# База: стоит с первой секунды, но цена у неё есть — из цены выводится курс ремонта.
# Хранилище стартовое несёт Const (как врождённый запас коммандера в PA); база сама
# потолок не поднимает — иначе старт удваивал бы то, что уже заложено в Const.

id    = "base"
name  = "База"
class = "structure"
color = [0.35, 0.4, 0.55]
tags  = ["structure", "economy", "important"]

[footprint]
rows           = ["###", "###", "###"]
facing_degrees = -90.0

[body]
max_health   = 4000.0
vision_range = 6.0

# База в экспансию не входит, хотя постройкой является и умолчание дало бы ей единицу.
# Показатель меряет то, что игрок нарастил, а база стоит с первой секунды и решением
# не является: считать её значило бы стартовать с ненулевого террора, который ничем
# не заработан. Ноль здесь — это «не в счёт», а не «забыли заполнить»
[terror]
expansion = 0.0

[assembly]
cost_metal = 800.0
