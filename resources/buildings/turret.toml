# Турель: постройка со стволом. С места не сходит, но башню крутит — поэтому
# turn_speed у неё есть, а speed нулевая.

id    = "turret"
base  = "/buildings/base_building.toml"
name  = "Турель"
class = "turret"
color = [0.6, 0.85, 1.0]
tags  = ["structure", "defense", "basic"]
tools = ["turret_gun"]

[footprint]
rows         = ["#"]
pattern      = "line"
# Ромб расходится кольцами от первой турели: перекрытие секторов важнее плотности,
# а сплошной стеной турели не ставят
pattern_alt  = "diamond"
pattern_step = "margin"

[body]
max_health = 250.0

[movement]
turn_speed = 90.0

[assembly]
cost_metal = 225.0

# Атака добавляется к унаследованному сносу.
[orders]
allow = ["attack", "delete"]
