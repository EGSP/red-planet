# Экстрактор: основной источник метала. Ставится только на точку метала и качает,
# пока стоит, — сам по себе он ничего не стоит обслуживать (как mex в PA / celestial).
#
# Метал берут отсюда; синтезатор остаётся сбросом излишков энергии. Точек конечное
# число, они расставлены по карте, и поднять доход можно только заняв новую.

id    = "extractor"
name  = "Экстрактор"
class = "structure"
color = [0.85, 0.55, 0.3]
tags  = ["structure", "economy", "basic"]

[footprint]
rows    = ["#"]
# Раскладка идёт не по решётке, а по залежам: протаскивание задаёт радиус,
# и на застройку помечаются все точки метала внутри него
pattern = "metal_area"
# Ставится исключительно на точку метала. Признак работает и в обратную сторону:
# постройка без него на точку не встанет, чтобы генератор не занял её безвозвратно
requires_metal_spot = true

[body]
max_health   = 250.0
vision_range = 6.0

# metal_extractor celestial: 7 металла, стоимость 170, энергия не жжёт
[production]
metal = 7.0

[assembly]
cost_metal = 170.0
