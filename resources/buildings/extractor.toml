# Экстрактор: основной источник метала. Ставится только на точку метала и качает,
# пока стоит, — сам по себе он ничего не стоит обслуживать.
#
# Механика та же, что у синтезатора: жжёт энергию и даёт метал. Разница в двух вещах,
# и обе намеренные. Курс здесь выгодный (около трёх с половиной энергии за метал против
# двадцати у синтезатора), поэтому метал берут отсюда, а синтезатор остаётся тем, чем был, —
# сбросом излишков энергии. И курс этот привязан к месту: точек конечное число, они
# расставлены по карте, и поднять доход можно только заняв новую.

id    = "extractor"
name  = "Экстрактор"
class = "factory"
color = [0.85, 0.55, 0.3]
tags  = ["structure", "economy", "basic"]

[footprint]
rows = ["#"]

# Ставится исключительно на точку метала. Признак работает и в обратную сторону:
# постройка без него на точку не встанет, чтобы генератор не занял её безвозвратно
requires_metal_spot = true

[body]
max_health   = 250.0
vision_range = 6.0

[conversion]
energy_drain = 18.0
metal_output = 5.0

[storage]
metal = 50.0

[assembly]
cost_metal = 90.0
