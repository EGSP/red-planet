# Синтезатор метала: жжёт энергию и даёт метал.
#
# В celestial отдельного metal maker нет — постройка остаётся местным сбросом излишков:
# когда генераторов больше, чем потребителей, лишняя энергия иначе сгорает на потолке.
# Курс намеренно невыгодный (десятки энергии за метал против бесплатного экстрактора).
#
# Id раньше был factory; переименован, чтобы не путать с заводом юнитов (bot_factory).

id    = "metal_maker"
base  = "/buildings/base_building.toml"
name  = "Синтезатор"
class = "factory"
color = [0.55, 0.62, 0.72]
tags  = ["structure", "economy", "basic"]

[footprint]
rows           = ["##", "##"]
pattern        = "line"
pattern_alt    = "square"
# Между синтезаторами нужен проход
pattern_step   = "margin"
facing_degrees = -90.0

[body]
max_health = 400.0

[conversion]
# Два генератора на единицу метала — всё ещё хуже бесплатного экстрактора, но
# уже не требует десятка станций на один синтезатор
energy_drain = 12.0
metal_output = 1.0

[assembly]
cost_metal = 100.0
