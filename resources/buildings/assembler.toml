# Башня-сборщик: делает работу фабрикатора, но с места не сходит. Строит каркасы
# и чинит всё, что попало в радиус её манипулятора.

id    = "assembler"
name  = "Башня-сборщик"
class = "assembler"
color = [0.45, 0.85, 0.6]
tags  = ["structure", "builder", "basic"]
tools = ["assembler_arm"]

[footprint]
rows         = ["#"]
pattern      = "line"
pattern_alt  = "square"
# Рабочая зона у сборщиков широкая, и плотный ряд им ни к чему
pattern_step = "margin"

[body]
max_health   = 260.0
vision_range = 9.0

[assembly]
cost_metal = 400.0
