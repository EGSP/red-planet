# Портал: условие победы. Большой, как база, и дорогой — его нельзя спрятать
# на стартовом пятачке и нельзя собрать «мимоходом»: он требует площадку и поток.
#
# В активном состоянии (после достройки) жжёт энергию сам по себе. Каркас платы
# не несёт: обязательство начинается, когда портал уже стоит и его надо удержать.

id    = "portal"
base  = "/buildings/base_building.toml"
name  = "Портал"
color = [0.35, 0.78, 0.92]
tags  = ["structure", "important"]

[footprint]
rows           = ["###", "###", "###"]
facing_degrees = -90.0

[body]
max_health = 5000.0

# Сам портал в террор по производству не входит: тот считается по выработке.
# В экспансию входит как любая постройка — место под него и есть цена роста наружу.
[terror]
expansion = 1.0

# Только расход, без выхода: портал ничего не производит, он жжёт энергию,
# пока активен. ~два реактора или пачка станций.
[conversion]
energy_drain = 50.0

[assembly]
cost_metal = 8000.0
