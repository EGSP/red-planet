# Общий предок стволов. Числа совпадают с умолчаниями WeaponDefinition в коде;
# конкретный файл перекрывает только отличия. Сам в каталог не попадает.

id       = "base_weapon"
abstract = true
name     = "Оружие"
kind     = "weapon"

range             = 3.0
damage            = 10.0
fire_interval     = 1.0
projectile_speed  = 14.0
spread_degrees    = 1.5
projectile_radius = 0.08
projectile_color  = [1.0, 0.85, 0.4]

# Поворот. aim_arc_degrees — половина сектора, в котором ствол доворачивается относительно
# корпуса: 180 — круговая башня, 0 — жёстко закреплённое орудие, которое наводят разворотом
# носителя. aim_rate_degrees — скорость этого доворота, своя, не общая с корпусом.
# aim_idle_delay — сколько держать последний угол, потеряв цель.
# body_assist по умолчанию выводится из сектора и потому здесь не задан.
aim_arc_degrees   = 180.0
aim_rate_degrees  = 180.0
aim_idle_delay    = 2.0

# Стрельба. Не путать с сектором наведения: fire_arc_degrees отсчитывается от оси САМОГО
# ствола и означает точность прицеливания, а не крепление.
fire_arc_degrees  = 8.0

# Урон по области. splash_radius — радиус взрыва в юнитах мира, splash_damage — урон
# в его середине; к краю он убывает по общей кривой из resources/tuning/combat.tres.
# Ноль означает оружие без взрыва: урон достаётся одной задетой цели, и она же
# из раздачи исключается, чтобы не получить дважды. splash_friendly_fire разрешает
# задевать своих.
splash_radius        = 0.0
splash_damage        = 0.0
splash_friendly_fire = false
