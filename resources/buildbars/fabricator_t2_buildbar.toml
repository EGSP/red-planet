# Панель тяжёлого фабрикатора: титаны и портал.
#
# Главенство 3 — ниже коммандерского и обычного фабрикаторского. При совместном выделении
# разметку задаёт коммандер, а эта панель добавляет к ней свою секцию.
#
# Секций economy и defence здесь нет намеренно: тяжёлый фабрикатор обычную застройку
# не ведёт, и повторять чужие ячейки было бы не согласованием координат, а дублированием
# умения. Правило совпадения координат из buildbar.md касается только общих построек.
#
# Портал только здесь: коммандер и обычный фабрикатор его больше не ставят, поэтому
# победа требует выхода на T2-строителя.

id = "fabricator_t2_buildbar"
priority = 3

[[sections]]
id = "titans"
title = "Титаны"
order = 2
cells = [
	{ x = 0, y = 0, build = "atlas" },
	{ x = 1, y = 0, build = "ares" },
]

[[sections]]
id = "special"
title = "Особое"
order = 3
cells = [
	{ x = 0, y = 0, build = "portal" },
]
