# Строительная панель фабрикатора.
# Главенство 2 — ниже коммандерского: при совместном выделении разметку задаёт коммандер,
# а эта панель на неё накладывается.
#
# ВНИМАНИЕ: координаты общих построек намеренно совпадают с commander.toml. Секции
# economy и defence здесь повторены один в один; юнитов фабрикатор не строит, и секции
# units у него нет вовсе. Сверяйте оба файла при любой правке — см. buildbar.md.

id = "fabricator"
priority = 2

[[sections]]
id = "economy"
title = "Экономика"
order = 0
cells = [
	{ x = 0, y = 1, build = "generator_t2" },
	{ x = 1, y = 1, build = "assembler" },
	{ x = 0, y = 0, build = "generator" },
	{ x = 1, y = 0, build = "factory" },
	{ x = 2, y = 0, build = "extractor" },
]

[[sections]]
id = "defence"
title = "Оборона"
order = 1
cells = [
	{ x = 0, y = 0, build = "turret" },
]
