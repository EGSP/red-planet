# Рубеж: линия из Shank с сопровождением Peacekeeper.
# Средний террор — ответ на появление армии и второй линии турелей.

id   = "shank_line"
name = "Рубеж"
tags = ["line"]

prefer_next = ["swarm_rush"]

terror_range = [30.0, -1]

army_power_budget     = 16.0
army_power_per_terror = 0.05

chill_interval_multiplier = 1.3

# Половина бюджета — Shank, остальное свободно (обычно Peacekeeper)
[[unit_list]]
mode                = "limit"
units               = ["shank"]
target_budget_share = 0.5

[spawn]
near_arc_degrees        = 50.0
far_arc_degrees         = 40.0
radius_depth_multiplier = 0.12
spacing_cells           = 1.1
