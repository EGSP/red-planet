# Накат: много дешёвых, узким остриём в одну точку периметра.
#
# Волна ранней партии: верхней границы нет намеренно, поскольку толпа Peacekeeper
# остаётся осмысленной угрозой и позже — просто её бюджет к тому времени наберёт другие волны.
#
# Множитель отдыха меньше единицы: после наката следующая волна приходит скорее обычного.
# Это и делает его накатом, а не одиночным ударом.

id   = "swarm_rush"
name = "Накат"
tags = ["swarm"]

# После толпы уместен кулак: игрок только что развернул оборону против множества слабых
prefer_next = ["heavy_group"]

terror_range = [-1, -1]

army_power_budget     = 2.0
army_power_per_terror = 0.1

chill_interval_multiplier = 0.6

# Только Peacekeeper: волна должна читаться как толпа, а не как смешанный отряд
[[unit_list]]
mode  = "allow"
units = ["peacekeeper"]

# Остриё к базе и малая глубина: плотная колонна, бьющая в одну точку обороны
[spawn]
near_arc_degrees        = 12.0
far_arc_degrees         = 35.0
radius_depth_multiplier = 0.1
spacing_cells           = 0.9
