# Удар титанов: одна тяжёлая машина с сопровождением из того, что помещается в остаток.
#
# ПОЧЕМУ ДОЛЯ, А НЕ СПИСОК allow. Волна из одного титана и ничего больше читалась бы как
# осадное орудие без прикрытия: игрок вывел бы против него любой отряд и разобрал бы его
# без потерь. Титан опасен ровно тем, что подойти к нему мешают остальные, поэтому режим
# здесь limit, а сопровождение набирается свободно из всего, что есть в игре к этому часу.
#
# Доля 0.55 при бюджете 40 даёт одного титана и примерно столько же мощи сопровождения.
# Второй титан появляется сам, когда террор поднимет бюджет прибавкой ниже.
#
# ПОЧЕМУ ГРАНИЦА ПО ТЕРРОРУ ТАК ВЫСОКА. Титан против базы без второго тира — это не пик
# напряжения, а конец партии. Сто очков означают развёрнутое производство и собранную
# армию, то есть игрока, которому есть чем ответить.

id   = "titan_strike"
name = "Удар титанов"
tags = ["titan"]

# После титана уместен накат: оборона игрока после него разрежена, и толпа добирает
# то, что титан не успел
prefer_next = ["swarm"]

terror_range = [500.0, -1]

army_power_budget     = 1500.0
army_power_per_terror = 0.25

# Наибольший множитель отдыха в наборе: восстановиться после титана дороже, чем после
# любой другой волны, и времени на это нужно соответственно больше
chill_interval_multiplier = 2.6

[[unit_list]]
mode                = "limit"
units               = ["thor", "odin"]
target_budget_share = 0.55

# Узкое остриё: титан идёт в одну точку, а не растягивается по периметру.
# Глубина больше обычной — сопровождение выстраивается за ним, а не рядом
[spawn]
near_arc_degrees        = 14.0
far_arc_degrees         = 30.0
radius_depth_multiplier = 0.22
spacing_cells           = 1.4
