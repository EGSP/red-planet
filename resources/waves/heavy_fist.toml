# Кулак: ядро из Maul с сопровождением из прочих.
#
# Доля отведена режимом limit, а не allow: сузить допустимое здесь было бы неверно —
# остаток бюджета должен уходить всему прочему, что к этому времени есть в игре, и дописывать
# новые виды в эту волну при их появлении не придётся.
#
# Волна тяжёлая, поэтому множитель отдыха больше единицы: после неё игроку нужно время
# восстановить оборону, иначе давление перестаёт быть волнообразным.

id   = "heavy_fist"
name = "Кулак"
tags = ["heavy_group"]

prefer_next = ["swarm"]

# Раньше сорока очков террора у игрока обычно нет и двух турелей, а кулак против них
# означает потерю базы, а не напряжение
terror_range = [40.0, -1]

# Единственная волна, растущая с показателем: она и есть ответ на позднюю партию
army_power_budget     = 20.0
army_power_per_terror = 0.15

chill_interval_multiplier = 2.0

# Треть бюджета уходит Maul, остальное набирается свободно
[[unit_list]]
mode                = "limit"
units               = ["maul"]
target_budget_share = 0.35

# Широкий фронт первого касания, сужающийся тыл: удар принимает сразу несколько построек
[spawn]
near_arc_degrees        = 45.0
far_arc_degrees         = 25.0
radius_depth_multiplier = 0.18
