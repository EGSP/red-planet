# Клещи: та же мощь, но приходит с двух сторон.
#
# Проверяет не оборону, а её распределение: периметр, прикрытый с одной стороны, эту волну
# не держит. Состав делится между очагами поочерёдно, поэтому обе стороны получают примерно
# равную мощь и смешанный состав.
#
# group_delay_seconds разводит очаги во времени: первый уже виден, второй ещё нет.
# Игрок решает, стягивать ли подвижную оборону к первому очагу. Против башен приём
# не действует. Задержка должна быть заметно меньше времени разбора первого очага —
# иначе получится не охват, а две отдельные волны подряд.
#
# Maul исключены: клещи должны быть быстрыми, иначе игрок успевает перебросить оборону
# с одной стороны на другую, и смысл двух очагов пропадает.

id   = "pincer"
name = "Клещи"
tags = ["split"]

terror_range = [40000.0, -1]

army_power_budget     = 14.0
army_power_per_terror = 0.5

chill_interval_multiplier = 0.8

[[unit_list]]
mode  = "deny"
units = ["maul"]

[spawn]
near_arc_degrees     = 20.0
far_arc_degrees      = 20.0
groups               = 2
groups_arc_degrees   = 140.0
group_delay_seconds  = 5.0
