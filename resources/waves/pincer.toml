# Клещи: та же мощь, но приходит с двух сторон разом.
#
# Проверяет не оборону, а её распределение: периметр, прикрытый с одной стороны, эту волну
# не держит. Состав делится между очагами поочерёдно, поэтому обе стороны получают примерно
# равную мощь и смешанный состав.
#
# Maul исключены: клещи должны быть быстрыми, иначе игрок успевает перебросить оборону
# с одной стороны на другую, и смысл двух очагов пропадает.

id   = "pincer"
name = "Клещи"
tags = ["split"]

terror_range = [25.0, -1]

army_power_budget     = 14.0
army_power_per_terror = 0.0

chill_interval_multiplier = 1.4

[[unit_list]]
mode  = "deny"
units = ["maul"]

[spawn]
near_arc_degrees   = 20.0
far_arc_degrees    = 20.0
groups             = 2
groups_arc_degrees = 140.0
