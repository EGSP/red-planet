# Общие числовые константы определений. Не юнит и не постройка: в каталог не попадает.
# Подстановка: vision_range = "/content/units.vars.toml/vision_range"
#
# Сюда — скаляры, которые разделяют несколько базовых/конкретных файлов и не образуют
# сами по себе шаблон сущности. Шаблон (секции, приказы, силуэт) — в base_unit /
# base_building.

# Обзор подвижных по умолчанию (боты, противник, строители)
vision_range = 9.0

# Обзор обычных построек (склады, генераторы, турели). Завод и сборщик перекрывают сами.
structure_vision = 6.0

# Доля дальности оружия, на которой юнит прекращает сближение и держит позицию.
# Значение общее для всех подвижных: личных значений у юнитов больше нет — сближение
# на разную глубину означало, что часть отряда въезжает под огонь заметно дальше остальных
approach_hold = 0.89
